<!-- Desktop Pet: 大肥鱼 (Big Fat Fish) -->
<div id="pet-container" class="pet-container" role="region" aria-label="大肥鱼桌宠">
  <!-- 对话气泡 -->
  <div id="pet-bubble" class="pet-bubble" aria-live="polite">
    <span id="pet-dialogue">摸鱼中... 咕噜噜~</span>
  </div>

  <!-- 桌宠本体交互区 -->
  <div id="pet-avatar-wrapper" class="pet-avatar-wrapper" title="点击和大肥鱼互动">
    <img
      id="pet-avatar"
      class="pet-avatar"
      src="{{ '/assets/img/pet/pet_idle.png' | relative_url }}"
      alt="大肥鱼桌宠"
      width="90"
      height="120"
      draggable="false"
      loading="lazy"
    >
    <div class="pet-shadow"></div>
  </div>

  <!-- 最小化/展开 切换按钮 -->
  <button id="pet-toggle-btn" class="pet-toggle-btn" type="button" aria-label="收起桌宠" title="收起桌宠">
    <i class="fas fa-times"></i>
  </button>
</div>

<!-- 最小化后恢复的小图标 -->
<button id="pet-restore-btn" class="pet-restore-btn d-none" type="button" aria-label="唤醒大肥鱼" title="唤醒大肥鱼">
  <img src="{{ '/assets/img/pet/pet_idle.png' | relative_url }}" alt="大肥鱼" width="28" height="37">
</button>
