<!--
  Jekyll Simple Search loader
  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{content}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '{{ '/assets/js/data/search.json' | relative_url }}',
      searchResultTemplate: '{{ result_elem | strip_newlines }}',
      noResultsText: '{{ not_found }}',
      templateMiddleware: function(prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'content') {
          return buildSnippet(value);
        }
      }
    });

    /*
     * Extract a context snippet around the first occurrence of the query:
     * ~50 chars before, the match wrapped in <mark>, ~200 chars after.
     * Start snaps back to a word / CJK sentence boundary. Falls back to the
     * beginning of the content when the query only matched title/categories.
     */
    function buildSnippet(text) {
      const BEFORE = 50;
      const AFTER = 200;
      const BREAKS = new Set([
        ' ', '\t', '\n',
        '，', '。', '！', '？', '；', '：', '、',
        ',', '.', '!', '?', ';', ':'
      ]);

      const input = document.getElementById('search-input').value.trim();
      const content = String(text || '');
      const idx = content.toLowerCase().indexOf(input.toLowerCase());

      if (!input || idx === -1) {
        return content.length > BEFORE + AFTER
          ? content.substring(0, BEFORE + AFTER) + '…'
          : content;
      }

      let start = Math.max(idx - BEFORE, 0);
      while (start > 0 && !BREAKS.has(content[start - 1])) {
        start--;
      }

      const end = Math.min(idx + input.length + AFTER, content.length);
      const prefix = (start > 0 ? '…' : '') + content.substring(start, idx);
      const hit = content.substring(idx, idx + input.length);
      const suffix =
        content.substring(idx + input.length, end) + (end < content.length ? '…' : '');

      return `${prefix}<mark>${hit}</mark>${suffix}`;
    }
  });
</script>
