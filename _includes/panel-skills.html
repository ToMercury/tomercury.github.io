<!-- The skills keyword panel (data: _data/skills.yml) -->

{% assign skills = site.data.skills %}

{% if skills and skills.size > 0 %}
  <section id="panel-skills">
    <h2 class="panel-heading">Skills</h2>
    <div class="d-flex flex-wrap mt-3 mb-1 me-3">
      {% for skill in skills %}
        <span
          class="post-tag"
          {% if skill.weight == 3 %}style="font-size: 1.1rem"
          {% elsif skill.weight == 2 %}style="font-size: 1rem"
          {% endif %}
        >
          {{- skill.name -}}
        </span>
      {% endfor %}
    </div>
  </section>
{% endif %}
